    // --- WEB SPEECH SYNTHESIS ENGINE (AUDIO READER) ---
    function speakText(text, langCode = 'en', onEndCallback) {
      if (typeof window === 'undefined' || !window.speechSynthesis) {
        alert('Voice Audio is not supported on this device/browser.');
        return null;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.92;
      utterance.pitch = 1.0;

      const voiceLangMap = {
        hi: 'hi-IN',
        bn: 'bn-IN',
        as: 'bn-IN',
        en: 'en-IN',

    // --- DEDICATED, ROCK-SOLID LEAFLET MAP VIEW COMPONENT ---
    function MapView({ hazards, safePlaces, mapFilter, lowBandwidth, onSelectMarker }) {
      const containerRef = useRef(null);
      const leafletMapRef = useRef(null);
      const markersLayerRef = useRef(null);
      const [activeItem, setActiveItem] = useState(null);

      // Clean Mount & Unmount Lifecycle
      useEffect(() => {
        const container = containerRef.current;
        if (!container || lowBandwidth || typeof window === 'undefined' || !window.L) {
          return;
        }

        const L = window.L;

        // Clean up previous Leaflet instance if attached
        if (leafletMapRef.current) {
          try { leafletMapRef.current.remove(); } catch(e) {}
          leafletMapRef.current = null;
        }
        if (container._leaflet_id) {
          container._leaflet_id = null;
        }

        try {
          const map = L.map(container, {
            center: [26.2006, 92.9376],
            zoom: 7,
            zoomControl: true
          });

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);

          const markersLayer = L.layerGroup().addTo(map);
          leafletMapRef.current = map;
          markersLayerRef.current = markersLayer;

          // Crucial: Invalidate size after DOM reflow so tiles load immediately
          setTimeout(() => {
            try {
              if (leafletMapRef.current) {
                leafletMapRef.current.invalidateSize();
              }
            } catch(e) {}
          }, 200);

        } catch (err) {
          console.warn('Leaflet initialization warning:', err);
        }

        return () => {
          if (leafletMapRef.current) {
            try { leafletMapRef.current.remove(); } catch(e) {}
            leafletMapRef.current = null;
          }
          markersLayerRef.current = null;
        };
      }, [lowBandwidth]);

      // Update Markers on Data / Filter Change
      useEffect(() => {
        const map = leafletMapRef.current;
        const layer = markersLayerRef.current;
        if (!map || !layer || !window.L) return;

        const L = window.L;
        layer.clearLayers();

        const allPins = [
          ...hazards.map(h => ({ ...h, cat: 'hazard' })),
          ...safePlaces.map(s => ({ ...s, cat: 'safe' }))
        ].filter(item => {
          if (mapFilter === 'all') return true;
          if (mapFilter === 'flood') return item.hazard_type === 'flood' || item.hazard_type === 'waterlogging';
          if (mapFilter === 'landslide') return item.hazard_type === 'landslide';
          if (mapFilter === 'shelter') return item.cat === 'safe';
          return true;
        });

        allPins.forEach(pin => {
          const color = pin.cat === 'safe' ? '#16A34A' : pin.hazard_type === 'flood' ? '#2563EB' : '#DC2626';
          const iconHtml = pin.cat === 'safe' ? '🏕️' : pin.hazard_type === 'flood' ? '🌊' : '⚠️';
          const customIcon = L.divIcon({
            html: `<div style="background-color: ${color}; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; border: 2.5px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 16px; cursor: pointer;">${iconHtml}</div>`,
            iconSize: [34, 34],
            iconAnchor: [17, 17]
          });

          const marker = L.marker([pin.latitude, pin.longitude], { icon: customIcon });
          marker.bindPopup(`
            <div style="font-family: system-ui, sans-serif; padding: 10px; max-width: 250px;">
              <strong style="color: #0f172a; font-size: 13px; display: block; line-height: 1.3;">${pin.title || pin.name}</strong>
              <p style="font-size: 11px; color: #64748b; margin: 4px 0 8px 0;">📍 ${pin.location_name || pin.address} (${pin.district})</p>
              <div style="display: flex; gap: 6px; align-items: center;">
                <span style="font-size: 10px; font-weight: bold; padding: 3px 6px; border-radius: 4px; background: #fee2e2; color: #991b1b;">
                  ${pin.status === 'verified' ? 'Verified' : 'Community Report'}
                </span>
                <a href="https://maps.google.com/?q=${pin.latitude},${pin.longitude}" target="_blank" style="font-size: 11px; padding: 3px 8px; border-radius: 4px; background: #0f172a; color: white; text-decoration: none; font-weight: bold;">Route ↗</a>
              </div>
            </div>
          `);
          marker.on('click', () => {
            setActiveItem(pin);
            if (onSelectMarker) onSelectMarker(pin);
          });
          layer.addLayer(marker);
        });

      }, [hazards, safePlaces, mapFilter]);

      return html`
        <div class="relative w-full h-full">
          <div ref=${containerRef} class="w-full h-full z-10" style=${{ display: lowBandwidth ? 'none' : 'block' }}></div>
          
          ${lowBandwidth && html`
            <div class="w-full h-full bg-[#0F172A] relative flex flex-col justify-between p-5 text-white overflow-hidden">

                  ⚡ Low-Bandwidth Topographical Mode Active
                </span>
                <span class="text-xs text-slate-400 font-mono">26.2°N, 92.9°E</span>
              </div>

              <!-- Interactive Pins Grid -->
              <div class="relative z-20 flex-1 grid grid-cols-2 sm:grid-cols-3 gap-3 py-4 overflow-y-auto">
                ${[...hazards, ...safePlaces].slice(0, 6).map(pin => html`
                  <div key=${pin.id} class="p-3 rounded-xl border border-slate-700 bg-slate-900/90 text-xs flex flex-col justify-between">
                    <div>
                      <span class="font-bold uppercase text-[10px] text-red-400">${pin.hazard_type || pin.place_type}</span>
                      <h4 class="font-bold text-white text-sm line-clamp-1 mt-0.5">${pin.title || pin.name}</h4>

                    </div>
                    <div class="mt-2 pt-2 border-t border-slate-800 flex justify-between items-center text-[11px]">
                      <span class="text-slate-400">📍 ${pin.district}</span>
                      <a href="https://maps.google.com/?q=${pin.latitude},${pin.longitude}" target="_blank" class="text-red-400 font-bold">Route →</a>
                    </div>
                  </div>
                `)}
              </div>

              <div class="relative z-20 pt-2 border-t border-slate-800 text-[11px] text-slate-400 flex items-center gap-3">
                <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> Floods

                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 ml-2"></span> Shelters

          `}

                  </div>

                  <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onClick=${() => setIsEmergencyModalOpen(false)} class="px-4 py-2 border rounded-lg font-semibold">
                      Cancel
                    </button>
                    <button type="submit" class="px-5 py-2 bg-red-600 text-white font-bold rounded-lg shadow-emergency">
                      SUBMIT SOS TICKET
                    </button>
                  </div>
                </form>
              </div>
            </div>
          `}

          <!-- Hazard Report Modal -->
          ${isHazardModalOpen && html`
            <div class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-3" onClick=${() => setIsHazardModalOpen(false)}>
              <div class="w-full max-w-lg bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]" onClick=${e => e.stopPropagation()}>
                <div class="bg-slate-900 text-white p-4 flex items-center justify-between">
                  <h3 class="font-bold text-base">${t('reportHazardBtn')}</h3>
                  <button onClick=${() => setIsHazardModalOpen(false)} class="text-slate-400">✕</button>
                </div>
                <div class="p-3 bg-amber-50 border-b border-amber-200 text-xs text-amber-950">
                  Submitted reports appear immediately on community map marked as <strong>"${t('unverifiedReport')}"</strong>.
                </div>
                <form
                  onSubmit=${e => {
                    e.preventDefault();
                    const form = e.target;
                    const newHaz = {
                      id: 'haz-' + Date.now(),
                      report_code: 'HZ-2026-' + Math.floor(1000 + Math.random() * 9000),
                      hazard_type: form.type.value,
                      title: form.title.value,
                      description: form.desc.value,
                      state: form.state.value,
                      district: form.district.value,
                      location_name: form.location.value,
                      latitude: 26.1738 + (Math.random() - 0.5) * 0.5,
                      longitude: 91.7820 + (Math.random() - 0.5) * 0.5,
                      severity: 'high',
                      status: 'unverified',
                      confirmations_count: 0
                    };
                    setHazards(prev => [newHaz, ...prev]);
                    setIsHazardModalOpen(false);
                    triggerToast(`Hazard ${newHaz.report_code} submitted as Unverified.`, 'success');
                  }}
                  class="p-5 space-y-3 overflow-y-auto text-xs sm:text-sm"
                >
                  <div>
                    <label class="block font-bold text-slate-800 mb-1">Hazard Category</label>
                    <select name="type" class="w-full p-2 border rounded-lg bg-white">
                      <option value="flood">🌊 River Flood / Embankment Breach</option>
                      <option value="landslide">⛰️ Landslide / Rockfall</option>
                      <option value="road_block">🚧 Highway / Road Obstruction</option>
                      <option value="waterlogging">🌧️ Urban Flash Waterlogging</option>
                    </select>
                  </div>

                  <div>
                    <label class="block font-bold text-slate-800 mb-1">Brief Title</label>
                    <input name="title" placeholder="e.g. Sinking road near Dzüdza bridge Km 46" required class="w-full p-2 border rounded-lg" />
                  </div>

                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block font-bold text-slate-800 mb-1">State</label>
                      <select name="state" class="w-full p-2 border rounded-lg bg-white">
                        ${NE_STATES.map(s => html`<option key=${s.name} value=${s.name}>${s.name}</option>`)}
                      </select>
                    </div>
                    <div>
                      <label class="block font-bold text-slate-800 mb-1">District</label>
                      <input name="district" placeholder="District name" defaultValue="Kohima" required class="w-full p-2 border rounded-lg" />
                    </div>
                  </div>

                  <div>
                    <label class="block font-bold text-slate-800 mb-1">Exact Location or Highway Milestone</label>
                    <input name="location" placeholder="e.g. NH-29 near Petrol Pump" required class="w-full p-2 border rounded-lg" />
                  </div>

                  <div>
                    <label class="block font-bold text-slate-800 mb-1">Observations</label>
                    <textarea name="desc" rows="2" placeholder="Passability for 2-wheelers, water depth..." class="w-full p-2 border rounded-lg"></textarea>
                  </div>

                  <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onClick=${() => setIsHazardModalOpen(false)} class="px-4 py-2 border rounded-lg font-semibold">
                      Cancel
                    </button>
                    <button type="submit" class="px-5 py-2 bg-orange-600 text-white font-bold rounded-lg shadow-sm">
                      SUBMIT HAZARD REPORT
                    </button>
                  </div>
                </form>
              </div>
            </div>
          `}

        </div>
      `;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
